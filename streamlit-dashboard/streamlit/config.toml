[theme]
# Paleta base — vai ser usada como padrão (modo claro)
primaryColor = "#4a7c7e"           # verde-petróleo suave
backgroundColor = "#fafaf7"         # creme bem claro
secondaryBackgroundColor = "#f0efe8" # creme um pouco mais escuro
textColor = "#2c3e3f"               # cinza-escuro esverdeado
font = "sans serif"

[server]
headless = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false